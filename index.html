<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Joining Roblox Server...</title>
    <script>
      // Anjas ngapain lihat disini ngentod
      const urlParams = new URLSearchParams(window.location.search);
      const placeId = urlParams.get("placeId");
      const jobId = urlParams.get("jobId");

      if (placeId && jobId) {
        const robloxLink = `roblox://placeID=${placeId}&gameInstanceId=${jobId}`;
        window.location.href = robloxLink;
      } else {
        document.write("<h3>Missing placeId or jobId in URL.</h3>");
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Roblox...</p>
  </body>
</html>
